<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background-color: #EBE8E0;
            margin: 0;
            height: 100vh;
            position: relative;
        }
        .bio-hero-scene {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 70vh;
            pointer-events: none;
        }
        .hero-alan {
            position: absolute;
            bottom: -1vw;
            left: 2vw;
            width: 32vw;
            object-fit: contain;
            mix-blend-mode: multiply;
            z-index: 2;
        }
        .hero-piano {
            position: absolute;
            bottom: -5vw;
            left: 8vw;
            width: 80vw;
            object-fit: contain;
            z-index: 1;
        }
        .hero-notes {
            position: absolute;
            bottom: 15vw;
            left: 32vw;
            width: 15vw;
            object-fit: contain;
            z-index: 3;
            transform: rotate(-5deg);
        }
    </style>
</head>
<body>
    <div class="bio-hero-scene">
        <img src="assets/piano.png" class="hero-piano" alt="Piano">
        <img src="assets/alan.png" class="hero-alan" alt="Alan">
        <img src="assets/notes.png" class="hero-notes" alt="Notes">
    </div>
</body>
</html>
