<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background-color: #EBE8E0;
            margin: 0;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .bio-hero-scene {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 60vh;
            pointer-events: none;
            border: 1px solid red;
        }
        .hero-alan {
            position: absolute;
            bottom: -2vw;
            left: 2vw;
            width: 38vw;
            object-fit: contain;
            mix-blend-mode: multiply;
            z-index: 2;
            border: 1px solid blue;
        }
        .hero-piano {
            position: absolute;
            bottom: 0;
            left: 8vw;
            width: 85vw;
            object-fit: contain;
            z-index: 1;
            border: 1px solid green;
        }
        .hero-notes {
            position: absolute;
            bottom: 18vw;
            left: 35vw;
            width: 16vw;
            object-fit: contain;
            z-index: 3;
            transform: rotate(22deg);
            border: 1px solid orange;
        }
    </style>
</head>
<body>
    <div class="bio-hero-scene">
        <img src="assets/piano.png" class="hero-piano" alt="Piano">
        <img src="assets/alan.png" class="hero-alan" alt="Alan">
        <img src="assets/notes.png" class="hero-notes" alt="Notes">
    </div>
</body>
</html>
